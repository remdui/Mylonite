name: Bug report
description: Report a reproducible problem in Mylonite.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please provide enough detail to reproduce the issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List exact steps, commands, and inputs.
      placeholder: |
        1. Start app with ...
        2. Visit ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / traceback
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "e.g. main@<sha> or 0.1.x"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Docker Compose (local)
        - Docker Compose (reverse-proxy)
        - Other
    validations:
      required: true
