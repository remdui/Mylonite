[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mylonite"
version = "0.1.0"
description = "Self-hosted portfolio and career-record platform"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Remy Duijsens" }
]
keywords = ["django", "portfolio", "self-hosted", "cv", "career-record"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
dependencies = [
  "Django>=5.2,<7.0",
  "gunicorn>=23.0,<27.0",
  "whitenoise>=6.12.0,<7.0",
]

[project.urls]
Homepage = "https://github.com/remdui/mylonite"
Repository = "https://github.com/remdui/mylonite"
Issues = "https://github.com/remdui/mylonite/issues"

[tool.setuptools.packages.find]
include = ["mylonite*", "apps*"]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.14.2,<8.0",
  "pytest-django>=4.9",
  "ruff>=0.15.18",
  "django-debug-toolbar>=7.0.0",
]
